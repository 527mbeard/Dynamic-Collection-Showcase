<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Movie Collection</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://use.typekit.net/qym4woj.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom px-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">🎬 The Film Lounge</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="collection.html">
                            <h1> Movies Collection</h1>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="about.html">
                            <h1>About Us </h1>
                        </a>
                    </li>

                    <button id="darkModeBtn" class="btn btnside btntoggle mt-2">
                        <div class="h2text"> Dark Mode →</div>
                    </button>

                </ul>
            </div>
        </div>
    </nav>
    <div class="section1collect">
        <h1 class="h1text">COLLECTION</h1>
        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-10">
            <div
                className="movie-card bg-[#7d0000] border-4 border-dashed border-white rounded-3xl overflow-hidden shadow-2xl transition duration-300">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop"
                    className="h-72 w-full object-cover" />

                <div className="p-6">
                    <div className="flex justify-between items-center mb-4">
                        <span className="bg-[#e6c88f] text-black px-3 py-1 rounded-full text-sm font-bold">
                            Action
                        </span>

                        <span className="text-sm">⭐ 8.4</span>
                    </div>

                    <h3 className="text-3xl font-black uppercase mb-2">
                        The Grey Man
                    </h3>

                    <p className="text-sm text-[#f5e7c4] leading-6 font-sans mb-5">
                        An intense spy thriller filled with betrayals, action sequences, and global missions.
                    </p>

                    <div className="flex justify-between items-center">
                        <span className="font-bold">2022</span>

                        <button
                            className="bg-[#e6c88f] text-black px-4 py-2 rounded-full font-bold hover:scale-105 transition">
                            View
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="collection.js"></script>

</html>
